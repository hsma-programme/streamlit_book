<script>
(function () {
  function wrap(iframe) {
    if (iframe.dataset.wrapped) return;
    iframe.dataset.wrapped = "1";
    const box = document.createElement("div");
    box.className = "stlite-box";
    const header = document.createElement("div");
    header.className = "stlite-header";
    header.textContent = "Interactive app: wait for it to load, then try it!";
    iframe.parentNode.insertBefore(box, iframe);
    box.appendChild(header);
    box.appendChild(iframe);
  }
  function run() { document.querySelectorAll("iframe.stlite").forEach(wrap); }
  document.addEventListener("DOMContentLoaded", run);
  new MutationObserver(run).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
