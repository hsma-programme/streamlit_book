    chapters:
    - app_colours.qmd
    - logos.qmd
    - fonts.qmd
  - part: Controlling Application Flow
    chapters:
    - forms_and_run_buttons.qmd
    - partial_reruns.qmd
    - custom_page_navigation.qmd
  - part: Advanced Concepts
    chapters:
    - caching.qmd
    - session_state.qmd
    - callbacks.qmd
    - persisting_data_between_sessions.qmd
  - part: Deployment
    chapters:
    - streamlit_community_cloud.qmd
    - stlite_github_pages.qmd
  - part: Exercises
    chapters:
    - exercise_1_identifying_opportunities.qmd
    - exercise_2a_simple_calculator.qmd
    - exercise_2b_wordcloud_app.qmd
    - exercise_3_dashboard.qmd
    - exercise_4_deployment.qmd
  - part: Additional Resources
    chapters:
    - cheat_sheet.qmd
  cover-image: assets/images/cover_image_robot.jpeg
  favicon: assets/images/hsma_logo_transparent_background_large.png
  search: true
  page-navigation: true
  back-to-top-navigation: true
  navbar:
    search: false
    background: '#8A1E1E'
    right:
      - icon: github
        aria-label: GitHub
        menu:
          - text: View the HSMA Github
            href:  https://github.com/hsma-programme
          - text: View the code for this book
            href:  https://github.com/hsma-programme/streamlit_book
  sidebar:
    search: true
    style: docked
    logo: assets/images/hsma_logo_transparent_background_large.png
    background: '#111111'
format:
  html:
    theme:
      dark:
      - darkly
      - assets/css/theme-dark.scss
      - assets/fonts/css/lexend.css
      light:
      - flatly
      - assets/css/theme-light.scss
      - assets/fonts/css/lexend.css
    css:
      - assets/css/styles.css
    include-in-header:
      - assets/html/stlite-wrap.html
    lightbox: true
    grid:
      sidebar-width: 250px
language:
  title-block-published: "Book last updated"
execute:
  keep-ipynb: False