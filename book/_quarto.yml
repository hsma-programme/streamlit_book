project:
  type: book
book:
  title: HSMA - Web Apps with Streamlit
  date: today
  author:
    - name: Sammi Rosser
      orcid: /0000-0002-9552-8988
      website: https://github.com/Bergam0t
    - name: Amy Heather
      orcid: 0000-0002-6596-3479
      website: https://github.com/amyheather
  google-analytics:
    tracking-id: "G-973P3EMW72"
    anonymize-ip: true
  cookie-consent:
    type: express
    style: simple
    palette: dark
  chapters:
  - index.qmd
  - part: An Introduction to Streamlit
    chapters:
    - hello_world_streamlit.qmd
  - part: Outputs
    chapters:
    - loading_data.qmd
    - text_markdown_and_titles.qmd
    - images_and_videos.qmd
    - warnings_errors_success_messages.qmd
    - dataframes.qmd
    - static_charts.qmd
    - interactive_charts.qmd
    - metrics.qmd
    - static_maps.qmd
    - interactive_maps.qmd
    - custom_components.qmd
  - part: User Inputs
    chapters:
    - introduction_to_inputs.qmd
    - text_numeric_and_selection_inputs.qmd
    - file_uploads.qmd
    - bidirectional_plots.qmd
    - bidirectional_maps.qmd
    - editable_dataframes.qmd
  - part: Downloading Outputs
    chapters:
    - file_downloads_tabular.qmd
    - file_downloads_images_charts.qmd
    - file_downloads_maps_static.qmd
    - file_downloads_maps_interactive.qmd
  - part: Layout
    chapters:
    - wide_layout.qmd
    - layout_divider.qmd
    - layout_columns.qmd
    - layout_sidebar.qmd
    - layout_tabs.qmd
    - layout_expander.qmd
    - multipage.qmd
